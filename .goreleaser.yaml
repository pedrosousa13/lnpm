# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: lnpm

# goreleaser's own default, stated rather than assumed: the release workflow
# verifies dist/checksums.txt.sig after this file's `signs:` block produces it,
# and that step should not depend on an unstated default staying put.
dist: dist

before:
  hooks:
    - go mod tidy

builds:
  - id: lnpm
    main: ./cmd/lnpm
    binary: lnpm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version=v{{.Version}}
      - -X main.Commit={{.ShortCommit}}
      - -X main.Date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE*
      - CHANGELOG*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Sign checksums.txt only: every archive and package already has an entry in it,
# so one signature covers the whole release. The signature is ASN.1 DER over the
# SHA-256 digest of the file, which is what crypto/ecdsa.VerifyASN1 consumes in
# internal/releasekeys. RELEASE_SIGNING_KEY_PATH is written by the release
# workflow before goreleaser runs; openssl needs the key as a file on disk.
signs:
  - id: checksums
    artifacts: checksum
    signature: "${artifact}.sig"
    cmd: openssl
    args:
      - dgst
      - -sha256
      - -sign
      - "{{ .Env.RELEASE_SIGNING_KEY_PATH }}"
      - -out
      - "${signature}"
      - "${artifact}"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch
  groups:
    - title: "Features"
      regexp: "^.*feat.*:.*$"
      order: 0
    - title: "Bug Fixes"
      regexp: "^.*fix.*:.*$"
      order: 1
    - title: "Other"
      order: 999

nfpms:
  - id: packages
    package_name: lnpm
    vendor: lnpm
    homepage: "https://github.com/pedrosousa13/lnpm"
    maintainer: "lnpm maintainers"
    description: "Fast local npm package development tool"
    license: "MIT"
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin

release:
  github:
    owner: pedrosousa13
    name: lnpm
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"

announce:
  skip: true
