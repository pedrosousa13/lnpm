# Checks that SECURITY.md's supported-versions table still names the major of
# the current release, and that the script doing the checking works. Both are
# scripts/check-security-versions.sh; its header carries the reasoning.
#
# This is a separate workflow rather than a job in ci.yaml. The separation was
# load-bearing when ci.yaml carried `paths-ignore` on both its triggers, with
# `'**.md'` and `'docs/**'` among the entries. A pull request touching only
# SECURITY.md or only CHANGELOG.md started no CI run then, and those are exactly
# the two files this check reads. A release-please PR that bumps the major
# touches one of them, so a check placed in ci.yaml would not have run in
# precisely the case it exists to catch.
#
# #500 removed that filter from `pull_request`, so the check would now run
# either way. ci.yaml keeps its filter on `push`, where nothing is gated on the
# result. What the separation still buys is a stale table failing under its own
# check name rather than as one job inside a red CI.
#
# There is no `paths-ignore` here on purpose. Do not add one.
name: Security Versions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Without this the job would inherit the repository-wide default, which is
# `write`. Both steps are `make` targets running bash scripts that read files
# out of the checkout and write only into their own temp dirs:
# scripts/check-security-versions.sh and scripts/test-check-security-versions.sh
# call no `gh`, no `git` and no network client, and nothing here references
# `secrets.` or sets GITHUB_TOKEN. Reading the checkout is the whole need.
# ci.yaml's block carries the rest of the reasoning, including what GitHub
# documents about unnamed scopes.
permissions:
  contents: read

jobs:
  check:
    name: Check supported versions
    runs-on: ubuntu-latest
    # Explicit, for the reason ci.yaml's `jobs:` header gives: GitHub's default
    # is 360 minutes, so a stalled job would hold a runner for six hours and
    # leave the PR unmergeable with a spinner as the only signal. This job is a
    # checkout and two bash scripts with no toolchain setup, no network use and
    # no test binary, so it takes seconds; 5 is the floor that convention gives
    # a job measured in seconds rather than a proportional share of anything.
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Runs first, so a break in the check itself is reported as a broken
      # check rather than as a stale table.
      - name: Test the supported-versions check
        run: make test-check-security-versions

      - name: Check SECURITY.md against the current release
        run: make check-security-versions
