name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Observed 9-30s. ci.yaml's `jobs:` header records why every job carries a
    # limit and what these limits cannot catch.
    timeout-minutes: 10
    # The workflow-level grant above is left as it was. Nothing in this job
    # should read GITHUB_TOKEN once release-please authenticates as the App,
    # so narrowing it to `permissions: {}` looks correct - but that is reasoning
    # about an action's internals, not a measurement, and it cannot be tested
    # before a real release runs. If it were wrong, the symptom would be a
    # release that stalls silently: precisely the failure #457 exists to remove.
    # Tracked separately rather than bundled into the fix for that failure.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # GitHub does not start workflow runs from events raised by GITHUB_TOKEN,
      # so that a workflow cannot retrigger itself forever. The release pull
      # request is such an event: with no `token:` below, release-please opened
      # it as `github-actions[bot]`, and every run on
      # `release-please--branches--main` was created and immediately parked as
      # `action_required` — created and finished in the same second, having
      # executed nothing. The required `Conventional Commit` check therefore did
      # not report at all (not even "pending"), and the pull request stayed
      # unmergeable until a human noticed the banner and clicked *Approve
      # workflows to run*. Three such runs landed in one day; #457 records them.
      #
      # An App installation token is a distinct identity, so the guard does not
      # apply to it and those runs start on their own. The App was chosen over a
      # personal access token because it does not expire and is not tied to one
      # person's account.
      #
      # `app-id` is deprecated in favour of `client-id`, but both are read (the
      # action falls back to `app-id` when `client-id` is empty) and the secret
      # the maintainer set holds the numeric App ID rather than the Client ID.
      # Switching the input means reissuing the secret, so it is left as is.
      #
      # docs/releasing.md records which App permissions this depends on and what
      # it looks like when they, or these secrets, go stale.
      - name: Mint a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-type: go

  goreleaser:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    # One sample, not a range: this job runs only when a release actually cuts,
    # and the last 25 runs contain exactly one — 158s, on run 33051081572, the
    # v2.4.0 release of 2026-08-27. 20 rather than 10 because that single
    # measurement is the widest thing here (it re-runs the whole test suite and
    # the linter, then cross-compiles every platform) and one point says nothing
    # about the spread. Narrow it once there are several releases to measure.
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Run tests
        run: go test -v -race ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Write release signing key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        # The key path is spelled once, here, as "$RUNNER_TEMP/...", and handed
        # to every later step through $GITHUB_ENV. `$RUNNER_TEMP` and
        # `${{ runner.temp }}` name the same directory but are not the same kind
        # of thing: the first is an environment variable the shell expands when
        # the step runs, the second is an expression Actions substitutes into
        # the YAML before any shell exists. This job used to use both for this
        # one path. The `uses:` step below has no shell, which is why the
        # expression form was there — exporting the variable instead means the
        # path has a single definition rather than two spellings that are only
        # equal by convention.
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "RELEASE_SIGNING_KEY is not set; refusing to publish an unsigned release" >&2
            exit 1
          fi
          install -m 600 /dev/null "$RUNNER_TEMP/release-signing-key.pem"
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release-signing-key.pem"
          echo "RELEASE_SIGNING_KEY_PATH=$RUNNER_TEMP/release-signing-key.pem" >> "$GITHUB_ENV"

      # The worst thing this pipeline can do is publish a release signed by a
      # key that no installed binary knows. `lnpm update` verifies
      # checksums.txt.sig against the public keys embedded from
      # internal/releasekeys/keys/*.pem, so a rotated, mistyped or simply
      # different RELEASE_SIGNING_KEY still produces a green release that every
      # existing install then refuses to update from — recoverable only by
      # reinstalling by hand. #297 is what that costs.
      #
      # This is the cheap half of the guard: derive the public half of the
      # secret and compare it to what is committed, before anything is built or
      # published. The post-sign step below re-checks the artefact goreleaser
      # actually produced; this one just fails first, when failing is free.
      #
      # Every keys/*.pem counts, because that directory is a set for rotation
      # and any one of them verifying is a release the fleet can consume. Only
      # public halves are ever printed. An empty glob leaves `pub` as the
      # literal pattern, which matches nothing and falls through to the failure
      # — the check has no way to pass by finding no keys.
      - name: Check the signing key matches an embedded public key
        run: |
          derived="$RUNNER_TEMP/release-signing-key.pub.pem"
          openssl pkey -in "$RELEASE_SIGNING_KEY_PATH" -pubout -out "$derived"
          for pub in internal/releasekeys/keys/*.pem; do
            if openssl pkey -pubin -in "$pub" -pubout 2>/dev/null | cmp -s - "$derived"; then
              echo "RELEASE_SIGNING_KEY matches the embedded public key in $pub"
              exit 0
            fi
          done
          echo "RELEASE_SIGNING_KEY does not match any key in internal/releasekeys/keys/*.pem." >&2
          echo "Publishing would produce a release that no installed lnpm can update from." >&2
          exit 1

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The other half of the guard, against the bytes that were really
      # published rather than against the key that was meant to sign them. This
      # cannot run any earlier — the signature does not exist until goreleaser
      # has made it — so it is a late check by necessity, and it catches what
      # the pre-flight cannot: goreleaser signing with something other than
      # RELEASE_SIGNING_KEY_PATH, or checksums.txt changing after it was signed.
      #
      # `dist` is set explicitly in .goreleaser.yaml so this path is not an
      # assumption about a default.
      - name: Verify the release signature against the embedded public keys
        run: |
          checksums=dist/checksums.txt
          signature="$checksums.sig"
          if [ ! -s "$signature" ]; then
            echo "$signature is missing or empty; goreleaser did not sign the release" >&2
            exit 1
          fi
          for pub in internal/releasekeys/keys/*.pem; do
            if openssl dgst -sha256 -verify "$pub" -signature "$signature" "$checksums" > /dev/null 2>&1; then
              echo "$signature verifies against $pub"
              exit 0
            fi
          done
          echo "$signature verifies against no key in internal/releasekeys/keys/*.pem." >&2
          echo "Installed copies of lnpm will refuse to update to this release." >&2
          exit 1

  # release-please builds the release body from the merged release PR's body,
  # which it computed from commit subjects when it opened the PR. Upgrade notes
  # hand-written into CHANGELOG.md on that branch afterwards are never read, so
  # the published body loses exactly the part no commit subject could carry
  # (#410). This job puts the version's changelog section back over the body.
  #
  # `needs` still names goreleaser, so this stays the last write to the body.
  # GoReleaser v2 documents `release.mode` as defaulting to keep-existing —
  # "keep the existing notes" — and .goreleaser.yaml sets no mode, so it should
  # not touch an existing body either way; the ordering makes that a preference
  # rather than something the body depends on.
  #
  # The `if` must not inherit goreleaser's result, though. GitHub's docs: "If a
  # job fails or is skipped, all jobs that need it are skipped unless the jobs
  # use a conditional expression that causes the job to continue", and "A
  # default status check of success() is applied unless you include one of
  # these functions" — success, always, cancelled, failure. A bare
  # `needs.release-please.outputs.release_created` includes none of them, so it
  # required *both* needs to succeed: one flaky `go test -race` in the
  # goreleaser job above would leave the release published, tagged and
  # note-less, with this job skipped rather than failed and the run still
  # green. `!cancelled()` includes one, so the default no longer applies, and
  # unlike `always()` it does not run this job on a cancelled workflow. A
  # failed release-please job still skips it, because release_created is then
  # empty.
  #
  # docs/releasing.md records the measurement behind all of this.
  sync-release-notes:
    needs: [release-please, goreleaser]
    if: ${{ !cancelled() && needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    # One sample too, from that same v2.4.0 run: 7s. It is a checkout and one
    # `gh release edit`, so 5 is generous against the only number there is.
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sync the release body from CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        # The section goes through a file rather than a pipe on purpose. In
        # `changelog-section.sh "$TAG" | gh release edit --notes-file -`, a
        # failing extractor hands gh an empty stdin and gh succeeds, blanking
        # the body of a release that is already published — the worst outcome
        # this job could have. Written to a file, both the extractor's exit
        # status and the file being non-empty are checked before gh runs. The
        # status is tested here rather than left to the runner's default
        # `bash -e {0}`, so the guard does not rest on a shell setting this
        # workflow never states.
        run: |
          if [ -z "$TAG" ]; then
            echo "release_created is set but tag_name is empty" >&2
            exit 1
          fi
          if ! ./scripts/changelog-section.sh "$TAG" > release-notes.md; then
            echo "could not extract a body for $TAG from CHANGELOG.md" >&2
            exit 1
          fi
          if [ ! -s release-notes.md ]; then
            echo "extracted an empty body for $TAG, refusing to publish it" >&2
            exit 1
          fi
          gh release edit "$TAG" --notes-file release-notes.md
