name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

# Every job below carries an explicit `timeout-minutes`, because GitHub's
# default is 360. A deadlocked test or a `go mod download` stalled on a network
# partition would otherwise hold a runner for six hours and leave the PR
# unmergeable that whole time, with a spinner as the only signal.
#
# Each value is at least 4x the slowest run measured for that job on
# 2026-08-27, rounded to something a human would pick. The multiple is not
# uniform and is not meant to be: the ceiling is what matters, so a job
# measured in seconds gets a floor of 5 or 10 minutes rather than a
# proportional share. The per-job comments carry the observed range, which is
# the only evidence behind any of these numbers — a passing pipeline is none,
# because a job that finishes proves only that it stayed under its limit.
#
# This does not address a run stuck in `queued`. `timeout-minutes` governs a
# job that is running, so no value here could have fired on the 2026-08-26
# outage, where GitHub accepted four runs and never materialized a single job
# on any of them. Nothing in workflow YAML can time out a run that never
# began, and for GitHub-hosted runners nothing else times one out quickly
# either: the documented 24h queue cancel is a self-hosted limit, and the only
# ceiling that covers a hosted run is the 35-day workflow-run limit, which
# explicitly counts time spent waiting. These limits are for hung *running*
# jobs, which is a real but different failure.
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # Observed 66-85s.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Not a Go test, so nothing below covers it. The release workflow reads
      # the release body out of CHANGELOG.md with this script, and a break in
      # it would otherwise surface only at the next release.
      - name: Run changelog extractor tests
        run: make test-changelog-section

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -race -coverpkg=./... -coverprofile=coverage-unit.out ./internal/... ./pkg/... ./cmd/...

      - name: Run workspace + e2e tests
        run: go test -v -race -coverpkg=./... -coverprofile=coverage-workspace.out ./tests/...

      - name: Merge coverage
        run: |
          echo "mode: atomic" > coverage.out
          grep -h -v "^mode:" coverage-unit.out coverage-workspace.out >> coverage.out

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          file: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Observed 21-44s.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    # Double every other job's limit, because this one is genuinely slower
    # rather than more variable: observed 185-257s, against 55-85s for the same
    # suite on Linux and macOS. A shared 10 would sit under 3x its slowest run.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -race ./internal/... ./pkg/... ./cmd/...

      - name: Run workspace + e2e tests
        run: go test -v -race ./tests/...

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    # Observed 55-72s.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -race ./internal/... ./pkg/... ./cmd/...

      - name: Run workspace + e2e tests
        run: go test -v -race ./tests/...

  build:
    name: Build
    runs-on: ubuntu-latest
    # Observed 67-77s.
    timeout-minutes: 10
    needs: [test, test-windows, test-macos, lint]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build for all platforms
        run: make release

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: bin/
