name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Not a Go test, so nothing below covers it. The release workflow reads
      # the release body out of CHANGELOG.md with this script, and a break in
      # it would otherwise surface only at the next release.
      - name: Run changelog extractor tests
        run: make test-changelog-section

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -race -coverpkg=./... -coverprofile=coverage-unit.out ./internal/... ./pkg/... ./cmd/...

      - name: Run workspace + e2e tests
        run: go test -v -race -coverpkg=./... -coverprofile=coverage-workspace.out ./tests/...

      - name: Merge coverage
        run: |
          echo "mode: atomic" > coverage.out
          grep -h -v "^mode:" coverage-unit.out coverage-workspace.out >> coverage.out

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          file: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -race ./internal/... ./pkg/... ./cmd/...

      - name: Run workspace + e2e tests
        run: go test -v -race ./tests/...

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -race ./internal/... ./pkg/... ./cmd/...

      - name: Run workspace + e2e tests
        run: go test -v -race ./tests/...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, test-windows, test-macos, lint]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build for all platforms
        run: make release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/
